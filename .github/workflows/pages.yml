name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/redesign-gh-pages-a99bwq
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Pages is already enabled for this repo with source "GitHub Actions".
      # Do NOT set enablement: true here - creating the Pages site needs admin
      # rights that GITHUB_TOKEN does not have, and the step fails with
      # "Resource not accessible by integration".
      - uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
